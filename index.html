<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول سيرفر MTA</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;height:100vh;margin:0;text-align:center}
  a{color:#38bdf8;font-size:1.2rem}
  code{background:#1e293b;padding:.2rem .5rem;border-radius:6px}
</style>
</head>
<body>
<div>
  <h2>جاري فتح MTA…</h2>
  <p id="addr"></p>
  <p><a id="link" href="#">إذا لم يفتح تلقائياً اضغط هنا</a></p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const ip = q.get('ip') || '';
  const port = q.get('port') || '22003';
  // تحقق بسيط لمنع أي روابط مشبوهة
  if (/^[a-zA-Z0-9.\-]+$/.test(ip) && /^\d{2,5}$/.test(port)) {
    const url = `mtasa://${ip}:${port}`;
    document.getElementById('addr').innerHTML = `<code>${ip}:${port}</code>`;
    document.getElementById('link').href = url;
    location.href = url;
  } else {
    document.querySelector('h2').textContent = 'رابط غير صالح';
  }
</script>
</body>
</html>
